name: Linux Release

on:
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode"
        required: true
        default: release
        type: choice
        options:
          - release
          - dev-linux
      tag:
        description: "Existing release tag, for example v0.1.0.0"
        required: false
        type: string
      publish:
        description: "Upload release assets when mode=release"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name || inputs.tag || inputs.mode }}
  cancel-in-progress: false

jobs:
  linux-bundles:
    name: Build Linux ${{ matrix.executable.name }} (${{ matrix.arch.id }})
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - id: x86_64
            runner: nixos
          - id: aarch64
            runner: ubuntu-24.04-arm
        executable:
          - name: cq-rdf
            release-output: cq-rdf-linux-release-artifacts
            dev-output: cq-rdf-linux-dev-release-artifacts
            usage-grep: "Cardano RDF pipeline primitives"
            dev-tag: dev-linux-cq-rdf
          - name: tx-graph
            release-output: tx-graph-linux-release-artifacts
            dev-output: tx-graph-linux-dev-release-artifacts
            usage-grep: "--rules"
            dev-tag: dev-linux-tx-graph
          - name: tx-view
            release-output: tx-view-linux-release-artifacts
            dev-output: tx-view-linux-dev-release-artifacts
            usage-grep: "canonical Turtle graph file"
            dev-tag: dev-linux-tx-view
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || github.ref }}

      - if: matrix.arch.runner == 'nixos'
        uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - if: matrix.arch.runner != 'nixos'
        uses: paolino/dev-assets/setup-nix@b901b08ce8d2e290d84e323486f7fa216b190df9
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: paolino/dev-assets/linux-release@b901b08ce8d2e290d84e323486f7fa216b190df9
        with:
          mode: >-
            ${{
              github.event_name == 'pull_request' && 'dev-linux'
              || inputs.mode
              || 'release'
            }}
          tag: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          publish: >-
            ${{
              github.event_name == 'push' && 'yes'
              || inputs.publish
              || 'no'
            }}
          release-output: ${{ matrix.executable.release-output }}
          dev-output: ${{ matrix.executable.dev-output }}
          executable-name: ${{ matrix.executable.name }}
          usage-grep: ${{ matrix.executable.usage-grep }}
          dev-tag: ${{ matrix.executable.dev-tag }}
          release-version-command: scripts/release/get-cabal-version
          release-check-command: 'scripts/release/check-version-consistency "$TAG"'
          release-notes-command: 'scripts/release/extract-notes "$TAG"'
          release-title: cardano-ledger-rdf ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          dev-release-title: ${{ matrix.executable.name }} dev Linux bundles
          github-token: ${{ github.token }}
