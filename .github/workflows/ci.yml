name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-gate:
    name: Build Gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build all derivations
        run: >-
          nix build --quiet
          .#checks.x86_64-linux.build
          .#checks.x86_64-linux.unit
          .#checks.x86_64-linux.lint
          .#checks.x86_64-linux.vocab-validate
          .#checks.x86_64-linux.vocab-owl-smoke
          .#checks.x86_64-linux.haddock-coverage
      - name: Release version contract
        run: scripts/release/check-version-consistency

  build:
    name: CI build
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build
        run: nix run --quiet .#build

  unit:
    name: CI unit
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Unit tests
        run: nix run --quiet .#unit

  lint:
    name: CI lint
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Lint
        run: nix run --quiet .#lint

  aarch64-eval:
    name: aarch64-linux evaluates (GHC cached)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: paolino/dev-assets/setup-nix@v0.1.0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Assert the aarch64 GHC is cached (no source build)
        run: |
          set -euo pipefail
          plan="$(nix build --dry-run .#packages.aarch64-linux.cq-rdf 2>&1 || true)"
          printf '%s\n' "$plan"
          built_ghc="$(printf '%s\n' "$plan" \
            | awk '/will be fetched/{f=0} /will be built:/{f=1;next} f' \
            | grep -E '/nix/store/[a-z0-9]+-ghc-[0-9]' || true)"
          if [ -n "$built_ghc" ]; then
            echo "::error::aarch64 GHC would be built from source (uncached):"
            printf '  %s\n' "$built_ghc"
            exit 1
          fi
          echo "aarch64 GHC is cached (no source build planned)"
