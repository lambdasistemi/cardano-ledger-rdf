site_name: cardano-ledger-rdf
site_url: !ENV [MKDOCS_SITE_URL, "https://lambdasistemi.github.io/cardano-ledger-rdf/"]
repo_url: https://github.com/lambdasistemi/cardano-ledger-rdf
repo_name: lambdasistemi/cardano-ledger-rdf

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - toc.integrate
    - content.code.copy

plugins:
  - search
  - asciinema-player

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - def_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - https://cdn.jsdelivr.net/gh/paolino/dev-assets@main/mkdocs/docs/js/read-aloud.js

nav:
  - Home: index.md
  - rules.yaml: rules-yaml.md
  - tx-graph: tx-graph.md
  - tx-fetch: tx-fetch.md
  - tx-view: tx-view.md
  - tx-lattice: tx-lattice.md
  - "May 2026 lattice demo": may-2026-amaru-lattice.md
  - Case studies:
      - Overview: case-studies/index.md
      - Template: case-studies/_template/case.md
      - "9-IO 2026 budget vote":
          - Presentation: case-studies/2026-io-budget-vote/case.md
          - Dataset selection: case-studies/2026-io-budget-vote/selection.md
          - Queries:
              - Asks per proposal: case-studies/2026-io-budget-vote/queries/q1-asks.md
              - Single beneficiary: case-studies/2026-io-budget-vote/queries/q2-single-beneficiary.md
              - Single guard policy: case-studies/2026-io-budget-vote/queries/q3-single-guard-policy.md
              - Proposer anchors: case-studies/2026-io-budget-vote/queries/q4-proposer-anchors.md
              - Vote tallies: case-studies/2026-io-budget-vote/queries/q5-vote-tallies.md
              - DRep behaviour: case-studies/2026-io-budget-vote/queries/q6-drep-behaviour.md
              - Anchor host distribution: case-studies/2026-io-budget-vote/queries/q7-anchor-host-distribution.md
  - "Prior art": prior-art.md
  - Operations:
      - "Repository secrets": operations/secrets.md
