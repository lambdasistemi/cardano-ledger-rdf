site_name: cardano-ledger-rdf
site_url: !ENV [MKDOCS_SITE_URL, "https://lambdasistemi.github.io/cardano-ledger-rdf/"]
repo_url: https://github.com/lambdasistemi/cardano-ledger-rdf
repo_name: lambdasistemi/cardano-ledger-rdf

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - toc.integrate
    - content.code.copy

plugins:
  - search
  - asciinema-player

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - def_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - https://cdn.jsdelivr.net/gh/paolino/dev-assets@main/mkdocs/docs/js/read-aloud.js

nav:
  - Home: index.md
  - Vocabulary: vocab.md
  - Tools:
      - tx-graph: tx-graph.md
      - tx-view: tx-view.md
      - rules.yaml: rules-yaml.md
  - Case studies:
      - Overview: case-studies/index.md
      - Template: case-studies/_template/case.md
      - "9-IO 2026 budget vote":
          - Presentation: case-studies/2026-io-budget-vote/case.md
          - Dataset selection: case-studies/2026-io-budget-vote/selection.md
          - Queries:
              - Asks per proposal: case-studies/2026-io-budget-vote/queries/q1-asks.md
              - Single beneficiary: case-studies/2026-io-budget-vote/queries/q2-single-beneficiary.md
              - Single guard policy: case-studies/2026-io-budget-vote/queries/q3-single-guard-policy.md
              - Proposer anchors: case-studies/2026-io-budget-vote/queries/q4-proposer-anchors.md
              - Vote tallies: case-studies/2026-io-budget-vote/queries/q5-vote-tallies.md
              - DRep behaviour: case-studies/2026-io-budget-vote/queries/q6-drep-behaviour.md
              - Anchor host distribution: case-studies/2026-io-budget-vote/queries/q7-anchor-host-distribution.md
      - "DRep vote correlations":
          - Presentation: case-studies/drep-vote-correlations/case.md
          - Dataset selection: case-studies/drep-vote-correlations/selection.md
          - Queries:
              - Pairwise agreement: case-studies/drep-vote-correlations/queries/q1-pairwise-agreement.md
              - Bloc detection: case-studies/drep-vote-correlations/queries/q2-bloc-detection.md
              - Swing prevalence: case-studies/drep-vote-correlations/queries/q3-swing-prevalence.md
              - Action-type correlation: case-studies/drep-vote-correlations/queries/q4-action-type-correlation.md
              - Anchor coverage: case-studies/drep-vote-correlations/queries/q5-anchor-coverage.md
              - Arrival-time dynamics: case-studies/drep-vote-correlations/queries/q6-arrival-time-dynamics.md
      - "2026-05 Amaru Treasury":
          - Presentation: case-studies/2026-05-amaru-treasury/case.md
          - Dataset selection: case-studies/2026-05-amaru-treasury/selection.md
          - Queries:
              - Conservation check: case-studies/2026-05-amaru-treasury/queries/q0-conservation-check.md
              - Monthly totals: case-studies/2026-05-amaru-treasury/queries/q1-monthly-totals.md
              - Where did USDM land?: case-studies/2026-05-amaru-treasury/queries/q2-where-did-usdm-land.md
              - Per-scope ADA flow: case-studies/2026-05-amaru-treasury/queries/q3-per-scope-ada-flow.md
              - Multisig shape distribution: case-studies/2026-05-amaru-treasury/queries/q4-multisig-shape-distribution.md
              - Vendor-payment chain: case-studies/2026-05-amaru-treasury/queries/q5-vendor-payment-chain.md
              - Disbursement detection: case-studies/2026-05-amaru-treasury/queries/q6-disbursement-detection.md
              - Per-scope USDM flow: case-studies/2026-05-amaru-treasury/queries/q7-per-scope-usdm-flow.md
              - Scoop detection: case-studies/2026-05-amaru-treasury/queries/q8-scoop-detection.md
              - Reference-script reuse: case-studies/2026-05-amaru-treasury/queries/q9-reference-script-reuse.md
              - Scoop-recipient resolution: case-studies/2026-05-amaru-treasury/queries/q10-scoop-recipient-resolution.md
